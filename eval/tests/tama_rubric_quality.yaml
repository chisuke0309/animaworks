# tama 文体・主述・比喩 rubric テスト
# 2026-05-08 chisuke 指摘:「仕事の道具を更新した」事件で
# 構造チェック（文字数・CTA整合・宙吊り検出）では拾えない
# 日本語の主述・比喩・フック強度をLLM-as-judgeで独立検証する。

description: "tama: 文体・主述・比喩・フック強度の rubric 採点（5項目すべて4点以上で合格）"

vars:
  topic: "今週のAIニュースまとめ — Anthropic・Google・OpenAIが同じ週に動いた"
  facts: |
    ①Anthropic: SpaceXとのコンピュート提携でClaude API/Codeの上限2倍化
    ②Google: Gemini Deep Research Max リリース、自律リサーチで可視化
    ③OpenAI: GPT-5.5 Instant でハルシネーション52.5%減

assert:
  # 採点者は Opus（厳しめ）。tama が Sonnet で書いたものを Opus で採点する想定
  - type: llm-rubric
    provider: anthropic:messages:claude-opus-4-7
    value: |
      以下の TikTok カルーセル overlay_texts (5枚) を5項目で評価せよ。

      1. **単体完結性**: 各スライドが、前後やキャプション無しで「何の話か」3秒で読み取れる
      2. **主述の自然さ**: 主語・目的語・所有関係が日本語として自然（「AI3社が仕事の道具を更新した」のように所有者が曖昧な比喩は不可）
      3. **比喩の成立**: 比喩を使う場合、視聴者の大半が同じ意味で受け取れる範囲（深読みしないと意味が通らない比喩は不可）
      4. **フック前のめり度**: 1枚目が「続きを見たい」と思わせる（過去の事実報告だけ、抽象語の羅列は不可）
      5. **ベネフィット主語**: 視聴者の利益・関心が主語になっている（製品名・企業名だけが主語は不可）

      合格基準（厳格）:
      - 5項目すべて 4 点以上 (5点満点)
      - 違和感を1つでも具体的に指摘できる箇所があれば不合格

      不合格の場合は failed=true で、問題スライドを具体的に列挙すること。
